<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedacito de Gracia - Catálogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-50/30 text-gray-800 pb-20">

  <!-- Header -->
  <header class="bg-white shadow-sm py-4 text-center sticky top-0 z-10">
    <h1 class="text-2xl font-serif text-amber-900 font-bold">Pedacito de Gracia</h1>
    <p class="text-xs text-amber-700">Galletas Artesanales • $2 USD c/u</p>
  </header>

  <!-- Contenedor de Productos -->
  <main class="max-w-md mx-auto p-4">
    <div id="grid-productos" class="grid grid-cols-1 gap-4">
      <p class="text-center text-gray-500 py-8">Cargando galletas frescas...</p>
    </div>
  </main>

  <!-- Modulo de Carrito y Checkout -->
  <div id="bar-carrito" class="fixed bottom-0 left-0 right-0 bg-white border-t border-amber-200 p-4 hidden shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <p class="text-xs text-gray-500">Total a pagar:</p>
        <p id="total-precio" class="text-xl font-bold text-amber-900">$0.00 USD</p>
      </div>
      <button onclick="abrirModalPedido()" class="bg-amber-800 hover:bg-amber-900 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition">
        Pedir por WhatsApp 📲
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qolbpidhqghublpczfbr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvbGJwaWRocWdodWJscGN6ZmJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTc3NzgsImV4cCI6MjEwNTU5Mzc3OH0.y3u_bUxn2veGSafUrlA3IYiAv00hMj0FOr_aqPnP2XE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let carrito = {};

    async function cargarProductos() {
      const { data: productos, error } = await supabaseClient
        .from('productos')
        .select('*')
        .eq('disponible', true);

      if (error) {
        console.error('Error cargando productos:', error);
        return;
      }

      const contenedor = document.getElementById('grid-productos');
      contenedor.innerHTML = '';

      productos.forEach(prod => {
        contenedor.innerHTML += `
          <div class="bg-white p-3 rounded-2xl shadow-sm border border-amber-100 flex gap-4 items-center">
            <img src="${prod.imagen_url}" class="w-20 h-20 object-cover rounded-xl" alt="${prod.nombre}">
            <div class="flex-1">
              <h3 class="font-bold text-gray-900">${prod.nombre}</h3>
              <p class="text-xs text-gray-500 line-clamp-2">${prod.descripcion || ''}</p>
              <p class="font-bold text-amber-800 mt-1">$${prod.precio.toFixed(2)} USD</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="cambiarCantidad(${prod.id}, -1, ${prod.precio}, '${prod.nombre}')" class="w-8 h-8 rounded-full bg-gray-100 font-bold">-</button>
              <span id="cant-${prod.id}" class="text-sm font-semibold">0</span>
              <button onclick="cambiarCantidad(${prod.id}, 1, ${prod.precio}, '${prod.nombre}')" class="w-8 h-8 rounded-full bg-amber-100 text-amber-900 font-bold">+</button>
            </div>
          </div>
        `;
      });
    }

    function cambiarCantidad(id, cambio, precio, nombre) {
      if (!carrito[id]) carrito[id] = { nombre, cantidad: 0, precio };
      carrito[id].cantidad += cambio;

      if (carrito[id].cantidad <= 0) delete carrito[id];

      document.getElementById(`cant-${id}`).innerText = carrito[id]?.cantidad || 0;
      actualizarBarraCarrito();
    }

    function actualizarBarraCarrito() {
      const total = Object.values(carrito).reduce((acc, item) => acc + (item.cantidad * item.precio), 0);
      const bar = document.getElementById('bar-carrito');
      
      if (total > 0) {
        bar.classList.remove('hidden');
        document.getElementById('total-precio').innerText = `$${total.toFixed(2)} USD`;
      } else {
        bar.classList.add('hidden');
      }
    }

    async function enviarPedidoWhatsApp(nombreCliente) {
      let resumen = Object.values(carrito)
        .map(i => `• ${i.cantidad}x ${i.nombre} ($${(i.cantidad * i.precio).toFixed(2)})`)
        .join('\n');
      
      const total = Object.values(carrito).reduce((acc, item) => acc + (item.cantidad * item.precio), 0);

      // 1. Guardar en Supabase
      const { data, error } = await supabaseClient
        .from('pedidos')
        .insert([{
          cliente_nombre: nombreCliente,
          resumen_pedido: resumen,
          total: total
        }]);

      if (error) {
        alert('Error registrando pedido. Intenta nuevamente.');
        return;
      }

      // 2. Redirigir a WhatsApp
      const telefonoWhatsApp = '584244178356';
      const mensaje = encodeURIComponent(
        `¡Hola! Quisiera realizar el siguiente pedido:\n\n*Cliente:* ${nombreCliente}\n\n*Detalle:*\n${resumen}\n\n*Total:* $${total.toFixed(2)} USD\n\nUbicación: San Diego, Carabobo.`
      );

      window.location.href = `https://wa.me/${telefonoWhatsApp}?text=${mensaje}`;
    }

    function abrirModalPedido() {
      const nombre = prompt('Ingresa tu nombre para el pedido:');
      if (nombre) enviarPedidoWhatsApp(nombre);
    }

    cargarProductos();
  </script>
</body>
</html>
